  return new Promise((ok,no)=>{
    if(TK&&Date.now()<TX)return ok(TK);
    if(!window.google||!google.accounts||!google.accounts.oauth2)return no("Google स्क्रिप्ट लोड नाही (इंटरनेट तपासा)");
    if(cid().startsWith("PASTE"))return no("Client ID भरलेला नाही");
    if(!interactive)return no("टोकन संपले आहे. 'Drive sync' बटण दाबा.");
    
    const client=google.accounts.oauth2.initTokenClient({
      client_id:cid(),
      scope:"https://www.googleapis.com/auth/drive.file",
      callback:r=>{
        if(r.error)return no(r.error);
        TK=r.access_token;
        TX=Date.now()+(r.expires_in-60)*1000;
        localStorage.mdmtk=JSON.stringify({t:TK,x:TX});
        localStorage.mdmok=1;
        ok(TK);
      },
      error_callback:e=>no(e.type=="popup_failed_to_open"?"पॉप-अप ब्लॉक झाले. ब्राउझरमध्ये Pop-ups Allow करा.":(e.type||"लॉगिन रद्द"))
    });
    client.requestAccessToken({prompt:localStorage.mdmok?"":"consent"});
  });
}

async function gx(u,o={},interactive=false){
  const t=await tok(interactive);
  const r=await fetch(u,{...o,headers:{Authorization:"Bearer "+t,...(o.headers||{})}});
  if(r.status==401&&!o.rt){
    TK=null;TX=0;localStorage.removeItem("mdmtk");
    return gx(u,{...o,rt:1},interactive);
  }
  if(!r.ok)throw new Error("HTTP "+r.status+" "+(await r.text()).slice(0,120));
  return r;
}

async function folder(interactive){
  if(FID){
    try{
      const chk=await gx(AP+"drive/v3/files/"+FID+"?fields=id,trashed",{},interactive);
      const j=await chk.json();
      if(!j.trashed)return FID;
    }catch(e){FID="";localStorage.removeItem("mdmfid2")}
  }
  const q=encodeURIComponent("name='MDM_Data' and mimeType='application/vnd.google-apps.folder' and trashed=false");
  let j=await(await gx(AP+"drive/v3/files?q="+q+"&fields=files(id)",{},interactive)).json();
  if(j.files&&j.files[0])FID=j.files[0].id;
  else{
    j=await(await gx(AP+"drive/v3/files",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name:"MDM_Data",mimeType:"application/vnd.google-apps.folder"})
    },interactive)).json();
    FID=j.id;
  }
  localStorage.mdmfid2=FID;
  return FID;
}

function parts(){
  const dl={},mn={},sp={};
  for(const k in S.days){
    const d={...S.days[k]};
    if(d.s)sp[k]=d.s;
    delete d.s;
    (d.h?mn:dl)[k]=d;
  }
  return{
    "Profiles.json":{ts:S.ts||0,sch:S.sch,cooks:S.cooks,hon:S.hon,fuel:S.fuel,cls:S.cls,lvl:S.lvl},
    "Praman.json":{rL:S.rL,rU:S.rU,N:S.N,nv:S.nv,menus:S.menus},
    "Opening_Stock.json":{inn:S.inn,op:S.op,op2:S.op2,opd:S.opd},
    "Daily_Entries.json":dl,
    "Meal_Not_Cook.json":mn,
    "School_Visit.json":S.mon,
    "Supplementary_Foods.json":{sup:S.sup,byDate:sp}
  };
}

function apply(p){
  const a=p["Profiles.json"]||{},b=p["Praman.json"]||{},sf=p["Supplementary_Foods.json"]||{},os=p["Opening_Stock.json"]||{};
  S=Object.assign({},D,{ts:a.ts,cls:a.cls||D.cls,lvl:a.lvl||D.lvl,op:os.op||[],op2:os.op2||[],opd:os.opd||D.opd,sch:a.sch||D.sch,cooks:a.cooks??D.cooks,hon:a.hon??D.hon,fuel:a.fuel??D.fuel,rL:b.rL??D.rL,rU:b.rU??D.rU,menus:b.menus||D.menus,N:b.N||D.N,inn:os.inn||[],mon:p["School_Visit.json"]||{},sup:sf.sup||D.sup,days:Object.assign({},p["Daily_Entries.json"],p["Meal_Not_Cook.json"])});
  const bd=sf.byDate||{};for(const k in bd)if(S.days[k])S.days[k].s=bd[k];
  if(!b.N)mig();else if(!b.nv)fixn();
  S.nv=2;
  localStorage.mdm=JSON.stringify(S);
  localStorage.mdmls=S.ts;
  localStorage.mdmlt=Date.now();
}

async function sync(manual=0){
  if(busy)return;
  busy=1;
  st("sync होत आहे…");
  try{
    const isInter=!!manual;
    const f=await folder(isInter);
    const l=await(await gx(AP+"drive/v3/files?q="+encodeURIComponent("'"+f+"' in parents and trashed=false")+"&fields=files(id,name)",{},isInter)).json();
    const ids={};
    (l.files||[]).forEach(x=>ids[x.name]=x.id);
    
    let dts=0;
    if(ids["Profiles.json"]){
      try{
        dts=(await(await gx(AP+"drive/v3/files/"+ids["Profiles.json"]+"?alt=media",{},isInter)).json()).ts||0;
      }catch(e){}
    }
    
    if(dts>(S.ts||0)){
      if(Object.keys(S.days).length&&!confirm("Drive वरील डेटा नवीन आहे. फोनवरील डेटा त्याने बदलायचा?")){
        st("sync रद्द केले");busy=0;return;
      }
      const p={};
      for(const n in ids){
        if(n.endsWith(".json"))p[n]=await(await gx(AP+"drive/v3/files/"+ids[n]+"?alt=media",{},isInter)).json();
      }
      apply(p);
      st("Drive वरून डेटा घेतला ✔",1);
      busy=0;
      return go(T);
    }
    
    const ts0=S.ts,P=parts();
    for(const n in P){
      const body=JSON.stringify(P[n]);
      let fileId=ids[n];
      if(!fileId){
        const cr=await gx(AP+"drive/v3/files",{
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body:JSON.stringify({name:n,parents:[f]})
        },isInter);
        const crj=await cr.json();
        fileId=crj.id;
        ids[n]=fileId;
      }
      await gx(AP+"upload/drive/v3/files/"+fileId+"?uploadType=media",{
        method:"PATCH",
        headers:{"Content-Type":"application/json"},
        body:body
      },isInter);
    }
    
    localStorage.mdmls=ts0;
    localStorage.mdmlt=Date.now();
    st("☁ मोबाईल आणि Drive दोन्हीकडे जतन झाले ✔",1);
    if(T=="h")vh();
  }catch(e){
    if(String(e).includes("404")){FID="";localStorage.removeItem("mdmfid2")}
    const m=String(e.message||e);
    if(!manual&&m.includes("टोकन संपले")){
      st("Drive sync बाकी - 'Drive sync' बटण दाबा");
    }else{
      st(m.includes("पॉप-अप")?"⚠ Google लॉगिन विंडो ब्लॉक झाली. ब्राउझर सेटिंग्जमध्ये Pop-ups Allow करा.":"Drive sync बाकी: "+m+" — 'Drive sync' पुन्हा दाबा",1);
    }
  }
  busy=0;
}
